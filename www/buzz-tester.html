<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzz Tester - SPECULATIVE IDOL</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding: 2rem;
            overflow-y: auto;
        }

        .page-title {
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-display);
            color: var(--neon-green);
            text-shadow: 0 0 20px var(--neon-green);
            text-align: center;
            margin-bottom: 0.25rem;
        }

        .page-subtitle {
            font-family: 'Courier New', monospace;
            font-size: var(--text-body);
            color: var(--neon-green);
            text-align: center;
            opacity: 0.7;
            margin-bottom: 2rem;
        }

        /* Two-column layout */
        .top-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        /* Sections */
        .section {
            border: 2px solid var(--neon-green);
            padding: 1.5rem;
        }

        .section-title {
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-heading);
            color: var(--neon-green);
            margin-bottom: 1rem;
        }

        /* Preset grid */
        .preset-scroll {
            max-height: 80vh;
            overflow-y: auto;
        }

        .category-label {
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-caption);
            color: var(--neon-magenta);
            text-shadow: 0 0 8px var(--neon-magenta);
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .category-label:first-child {
            margin-top: 0;
        }

        .category-label.combo-label {
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.4rem;
            margin-bottom: 0.75rem;
        }

        .preset-btn {
            background: var(--black);
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 0.4rem 0.6rem;
            font-family: 'Courier New', monospace;
            font-size: var(--text-caption);
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
        }

        .preset-btn:hover {
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 10px var(--neon-green);
        }

        .preset-btn.active {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green), inset 0 0 10px rgba(0, 255, 0, 0.15);
            background: rgba(0, 255, 0, 0.1);
        }

        .preset-btn.stacked {
            border-color: var(--neon-magenta);
            box-shadow: 0 0 10px var(--neon-magenta), inset 0 0 8px rgba(255, 0, 255, 0.15);
            background: rgba(255, 0, 255, 0.1);
            color: var(--neon-magenta);
        }

        .preset-btn.stacked.active {
            box-shadow: 0 0 15px var(--neon-magenta), 0 0 15px var(--neon-green);
        }

        /* Stack preset (combo) buttons */
        .preset-btn.combo {
            border-color: var(--neon-yellow);
            color: var(--neon-yellow);
        }
        .preset-btn.combo:hover {
            background: rgba(255, 255, 0, 0.1);
            box-shadow: 0 0 10px var(--neon-yellow);
        }
        .preset-btn.combo.active {
            box-shadow: 0 0 15px var(--neon-yellow), inset 0 0 10px rgba(255, 255, 0, 0.15);
            background: rgba(255, 255, 0, 0.1);
        }

        /* Auto-stack toggle */
        .preset-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .auto-stack-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: var(--text-caption);
            color: var(--neon-green);
            user-select: none;
        }

        .auto-stack-toggle input[type="checkbox"] {
            display: none;
        }

        .toggle-switch {
            width: 36px;
            height: 18px;
            border: 2px solid var(--neon-green);
            position: relative;
            transition: all 0.2s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            top: 2px;
            left: 2px;
            background: var(--neon-green);
            transition: all 0.2s;
        }

        .auto-stack-toggle input:checked ~ .toggle-switch {
            border-color: var(--neon-magenta);
        }

        .auto-stack-toggle input:checked ~ .toggle-switch::after {
            left: 20px;
            background: var(--neon-magenta);
        }

        .auto-stack-toggle input:checked ~ .toggle-label {
            color: var(--neon-magenta);
        }

        .toggle-label {
            transition: color 0.2s;
        }

        /* Editing indicator on stack layer */
        .stack-layer.editing {
            border-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green);
        }

        .layer-edit-indicator {
            color: var(--neon-green);
            font-size: var(--text-caption);
            font-family: 'Courier New', monospace;
            opacity: 0.7;
        }

        /* Right column: controls + stack */
        .right-col {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Collapsible controls */
        .controls-header {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            user-select: none;
            margin-bottom: 1rem;
        }
        .controls-header .toggle-arrow {
            transition: transform 0.2s;
            font-size: var(--text-body);
        }
        .controls-section.collapsed .controls-grid {
            display: none;
        }
        .controls-section.collapsed .controls-header {
            margin-bottom: 0;
        }
        .controls-section.collapsed .toggle-arrow {
            transform: rotate(0deg);
        }
        .controls-section:not(.collapsed) .toggle-arrow {
            transform: rotate(90deg);
        }

        /* Controls */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem 1.5rem;
        }

        .control-row {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .control-label {
            font-family: 'Courier New', monospace;
            font-size: var(--text-caption);
            color: var(--neon-green);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .control-value {
            color: var(--neon-yellow);
            font-weight: bold;
            min-width: 5ch;
            text-align: right;
        }

        .control-row select {
            padding: 0.4rem;
            font-size: var(--text-caption);
        }

        .control-row input[type="range"] {
            width: 100%;
            accent-color: var(--neon-green);
            cursor: pointer;
        }

        /* Action bar */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            margin-top: 1rem;
        }

        .btn-play {
            background: var(--neon-green);
            color: var(--black);
            border: 3px solid var(--neon-green);
            padding: 1rem 2.5rem;
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-heading);
            cursor: pointer;
            animation: playPulse 2s ease-in-out infinite;
        }

        .btn-play:hover {
            background: var(--black);
            color: var(--neon-green);
            box-shadow: 0 0 30px var(--neon-green);
        }

        .btn-play:active {
            transform: scale(0.96);
        }

        @keyframes playPulse {
            0%, 100% { box-shadow: 0 0 5px var(--neon-green); }
            50% { box-shadow: 0 0 20px var(--neon-green), 0 0 40px rgba(0, 255, 0, 0.3); }
        }

        .btn-export {
            background: var(--black);
            color: var(--neon-yellow);
            border: 2px solid var(--neon-yellow);
            padding: 0.75rem 1.5rem;
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-caption);
            cursor: pointer;
        }

        .btn-export:hover {
            box-shadow: 0 0 15px var(--neon-yellow);
            background: rgba(255, 255, 0, 0.1);
        }

        .toast {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--neon-green);
            color: var(--black);
            padding: 0.75rem 1.5rem;
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-caption);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        /* Stack section */
        .stack-section {
            border: 2px solid var(--neon-magenta);
            padding: 1.5rem;
        }

        .stack-section .section-title {
            color: var(--neon-magenta);
        }

        .stack-header {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            margin-bottom: 1rem;
        }

        .btn-play-stack {
            background: var(--neon-magenta);
            color: var(--black);
            border: 2px solid var(--neon-magenta);
            padding: 0.5rem 1.5rem;
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-caption);
            cursor: pointer;
        }

        .btn-play-stack:hover {
            background: var(--black);
            color: var(--neon-magenta);
            box-shadow: 0 0 20px var(--neon-magenta);
        }

        .btn-play-stack:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-export-stack {
            background: var(--black);
            color: var(--neon-yellow);
            border: 2px solid var(--neon-yellow);
            padding: 0.5rem 1rem;
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-caption);
            cursor: pointer;
        }

        .btn-export-stack:hover {
            box-shadow: 0 0 15px var(--neon-yellow);
            background: rgba(255, 255, 0, 0.1);
        }

        .btn-export-stack:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-clear-stack {
            background: var(--black);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
            padding: 0.4rem 0.75rem;
            font-family: 'Courier New', monospace;
            font-size: var(--text-caption);
            cursor: pointer;
        }

        .btn-clear-stack:hover {
            box-shadow: 0 0 10px var(--neon-red);
        }

        .stack-empty {
            font-family: 'Courier New', monospace;
            font-size: var(--text-caption);
            opacity: 0.5;
            padding: 1rem 0;
        }

        .stack-layers {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .stack-layer {
            border: 1px solid var(--neon-magenta);
            padding: 0.6rem 0.75rem;
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 0.75rem;
            align-items: center;
            font-family: 'Courier New', monospace;
            font-size: var(--text-caption);
        }

        .layer-num {
            color: var(--neon-magenta);
            font-weight: bold;
        }

        .layer-name {
            color: var(--neon-green);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .layer-delay {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--neon-yellow);
            white-space: nowrap;
        }

        .layer-delay input[type="range"] {
            width: 80px;
            accent-color: var(--neon-magenta);
        }

        .layer-delay-val {
            min-width: 4ch;
            text-align: right;
        }

        .btn-remove-layer {
            background: none;
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
            padding: 0.2rem 0.5rem;
            font-family: 'Courier New', monospace;
            font-size: var(--text-caption);
            cursor: pointer;
            line-height: 1;
        }

        .btn-remove-layer:hover {
            background: var(--neon-red);
            color: var(--black);
        }

        /* Reduced motion notice */
        .reduced-motion-notice {
            display: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .reduced-motion-notice {
                display: block;
                text-align: center;
                padding: 4rem 2rem;
                font-family: 'Press Start 2P', cursive;
                font-size: var(--text-body);
                color: var(--neon-yellow);
                line-height: 2;
            }
            .main-content {
                display: none;
            }
        }

        /* Responsive */
        @media (max-width: 900px) {
            body {
                padding: 1rem;
            }
            .top-row {
                grid-template-columns: 1fr;
            }
            .controls-grid {
                grid-template-columns: 1fr;
            }
            .preset-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            .preset-scroll {
                max-height: none;
            }
            .btn-play {
                width: 100%;
            }
            .action-bar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="reduced-motion-notice">
        Sound tester requires motion/audio.<br>
        Not available in reduced motion mode.
    </div>

    <div class="main-content">
        <h1 class="page-title">BUZZ TESTER</h1>
        <div class="page-subtitle">Sound Design Sandbox</div>

        <div class="top-row">
            <!-- Left: Presets -->
            <div class="section">
                <div class="preset-header">
                    <div class="section-title" style="margin-bottom:0">PRESETS</div>
                    <label class="auto-stack-toggle">
                        <input type="checkbox" id="autoStackToggle" onchange="toggleAutoStack()">
                        <span class="toggle-switch"></span>
                        <span class="toggle-label">AUTO-STACK</span>
                    </label>
                </div>
                <div class="preset-scroll" id="presetContainer"></div>
            </div>

            <!-- Right: Controls + Stack -->
            <div class="right-col">
                <div class="section controls-section collapsed" id="controlsSection">
                    <div class="controls-header" onclick="toggleControls()">
                        <span class="toggle-arrow">&#9654;</span>
                        <div class="section-title" style="margin-bottom:0">CONTROLS</div>
                    </div>
                    <div class="controls-grid">
                        <div class="control-row">
                            <label class="control-label">
                                Waveform 1
                                <span class="control-value" id="val-osc1Type"></span>
                            </label>
                            <select id="ctrl-osc1Type" aria-label="Waveform 1">
                                <option value="sine">sine</option>
                                <option value="square">square</option>
                                <option value="sawtooth" selected>sawtooth</option>
                                <option value="triangle">triangle</option>
                            </select>
                        </div>

                        <div class="control-row">
                            <label class="control-label">
                                Frequency 1
                                <span class="control-value" id="val-osc1Freq"></span>
                            </label>
                            <input type="range" id="ctrl-osc1Freq" min="0" max="1000" value="500"
                                   aria-label="Frequency 1" aria-valuemin="40" aria-valuemax="8000">
                        </div>

                        <div class="control-row">
                            <label class="control-label">
                                Waveform 2
                                <span class="control-value" id="val-osc2Type"></span>
                            </label>
                            <select id="ctrl-osc2Type" aria-label="Waveform 2">
                                <option value="off" selected>off</option>
                                <option value="sine">sine</option>
                                <option value="square">square</option>
                                <option value="sawtooth">sawtooth</option>
                                <option value="triangle">triangle</option>
                            </select>
                        </div>

                        <div class="control-row">
                            <label class="control-label">
                                Frequency 2
                                <span class="control-value" id="val-osc2Freq"></span>
                            </label>
                            <input type="range" id="ctrl-osc2Freq" min="0" max="1000" value="500"
                                   aria-label="Frequency 2" aria-valuemin="40" aria-valuemax="8000">
                        </div>

                        <div class="control-row">
                            <label class="control-label">
                                Volume
                                <span class="control-value" id="val-volume"></span>
                            </label>
                            <input type="range" id="ctrl-volume" min="0" max="100" value="30"
                                   aria-label="Volume">
                        </div>

                        <div class="control-row">
                            <label class="control-label">
                                Duration
                                <span class="control-value" id="val-duration"></span>
                            </label>
                            <input type="range" id="ctrl-duration" min="1" max="30" value="5"
                                   aria-label="Duration">
                        </div>

                        <div class="control-row">
                            <label class="control-label">
                                Distortion
                                <span class="control-value" id="val-distortion"></span>
                            </label>
                            <input type="range" id="ctrl-distortion" min="0" max="600" value="0"
                                   aria-label="Distortion">
                        </div>

                        <div class="control-row">
                            <label class="control-label">
                                Filter Freq
                                <span class="control-value" id="val-filterFreq"></span>
                            </label>
                            <input type="range" id="ctrl-filterFreq" min="0" max="1000" value="500"
                                   aria-label="Filter Frequency" aria-valuemin="100" aria-valuemax="10000">
                        </div>

                        <div class="control-row">
                            <label class="control-label">
                                Filter Q
                                <span class="control-value" id="val-filterQ"></span>
                            </label>
                            <input type="range" id="ctrl-filterQ" min="1" max="500" value="10"
                                   aria-label="Filter Q">
                        </div>

                        <div class="control-row">
                            <label class="control-label">
                                Detune
                                <span class="control-value" id="val-detune"></span>
                            </label>
                            <input type="range" id="ctrl-detune" min="-500" max="500" value="0"
                                   aria-label="Detune">
                        </div>
                    </div>
                </div>

                <!-- Sound Stack -->
                <div class="stack-section">
                    <div class="section-title">SOUND STACK</div>
                    <div class="stack-header" id="stackHeader">
                        <button class="btn-play-stack" id="btnPlayStack" onclick="playStack()" disabled>PLAY STACK</button>
                        <button class="btn-export-stack" id="btnExportStack" onclick="exportStackOrSingle()" disabled>EXPORT</button>
                        <button class="btn-clear-stack" id="btnClearStack" onclick="clearStack()">CLEAR</button>
                    </div>
                    <div id="stackLayers">
                        <div class="stack-empty">Click a preset to load a sound.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Copied!</div>

    <script src="sounds.js"></script>
    <script>
    (function() {
        'use strict';

        // --- Log-scale helpers ---
        function sliderToFreq(sliderVal, minHz, maxHz) {
            var t = sliderVal / 1000;
            return minHz * Math.pow(maxHz / minHz, t);
        }

        function freqToSlider(freq, minHz, maxHz) {
            return 1000 * Math.log(freq / minHz) / Math.log(maxHz / minHz);
        }

        // --- Preset definitions ---
        var PRESETS = {
            // Game Show
            'Classic Buzzer': {
                category: 'Game Show',
                osc1Type: 'sawtooth', osc1Freq: 220,
                osc2Type: 'off', osc2Freq: 220,
                volume: 0.3, duration: 0.3,
                distortion: 200, filterFreq: 1000, filterQ: 1, detune: 0
            },
            'Tritone Doom': {
                category: 'Game Show',
                osc1Type: 'sawtooth', osc1Freq: 300,
                osc2Type: 'square', osc2Freq: 424,
                volume: 0.3, duration: 0.6,
                distortion: 200, filterFreq: 1000, filterQ: 1, detune: 0
            },
            'Wrong Answer': {
                category: 'Game Show',
                osc1Type: 'sawtooth', osc1Freq: 250,
                osc2Type: 'square', osc2Freq: 354,
                volume: 0.3, duration: 0.5,
                distortion: 150, filterFreq: 1000, filterQ: 1, detune: 0
            },
            'Air Horn': {
                category: 'Game Show',
                osc1Type: 'sawtooth', osc1Freq: 500,
                osc2Type: 'sawtooth', osc2Freq: 510,
                volume: 0.5, duration: 1.0,
                distortion: 100, filterFreq: 1000, filterQ: 1, detune: 10
            },
            'Price Is Wrong': {
                category: 'Game Show',
                osc1Type: 'sawtooth', osc1Freq: 200,
                osc2Type: 'sawtooth', osc2Freq: 150,
                volume: 0.35, duration: 0.8,
                distortion: 100, filterFreq: 800, filterQ: 3, detune: 0
            },
            'Double Dare': {
                category: 'Game Show',
                osc1Type: 'square', osc1Freq: 330,
                osc2Type: 'square', osc2Freq: 440,
                volume: 0.3, duration: 0.4,
                distortion: 80, filterFreq: 1000, filterQ: 1, detune: 0
            },
            'Jeopardy Fail': {
                category: 'Game Show',
                osc1Type: 'sawtooth', osc1Freq: 280,
                osc2Type: 'triangle', osc2Freq: 140,
                volume: 0.35, duration: 0.7,
                distortion: 120, filterFreq: 600, filterQ: 2, detune: 0
            },

            // Emergency/Alarm
            'EAS Alert': {
                category: 'Emergency/Alarm',
                osc1Type: 'sine', osc1Freq: 853,
                osc2Type: 'sine', osc2Freq: 960,
                volume: 0.3, duration: 2.0,
                distortion: 0, filterFreq: 1000, filterQ: 1, detune: 0
            },
            'Siren Wail': {
                category: 'Emergency/Alarm',
                osc1Type: 'sawtooth', osc1Freq: 800,
                osc2Type: 'off', osc2Freq: 220,
                volume: 0.3, duration: 2.0,
                distortion: 100, filterFreq: 1000, filterQ: 1, detune: 0
            },
            'Alarm Clock': {
                category: 'Emergency/Alarm',
                osc1Type: 'square', osc1Freq: 2500,
                osc2Type: 'square', osc2Freq: 2510,
                volume: 0.3, duration: 1.0,
                distortion: 0, filterFreq: 1000, filterQ: 1, detune: 0
            },
            'Feedback Screech': {
                category: 'Emergency/Alarm',
                osc1Type: 'sawtooth', osc1Freq: 3500,
                osc2Type: 'off', osc2Freq: 220,
                volume: 0.3, duration: 1.0,
                distortion: 300, filterFreq: 3500, filterQ: 40, detune: 0
            },
            'Nuclear Meltdown': {
                category: 'Emergency/Alarm',
                osc1Type: 'sawtooth', osc1Freq: 440,
                osc2Type: 'square', osc2Freq: 443,
                volume: 0.4, duration: 2.0,
                distortion: 250, filterFreq: 500, filterQ: 5, detune: 3

        // --- Build preset UI ---
        function buildPresets() {
            var container = document.getElementById('presetContainer');
            var categorized = {};
            CATEGORY_ORDER.forEach(function(cat) { categorized[cat] = []; });

            Object.keys(PRESETS).forEach(function(name) {
                var cat = PRESETS[name].category;
                if (!categorized[cat]) categorized[cat] = [];
                categorized[cat].push(name);
            });

            // Render normal preset categories
            CATEGORY_ORDER.forEach(function(cat) {
                if (!categorized[cat] || categorized[cat].length === 0) return;

                var label = document.createElement('div');
                label.className = 'category-label';
                label.textContent = cat;
                container.appendChild(label);

                var grid = document.createElement('div');
                grid.className = 'preset-grid';

                categorized[cat].forEach(function(name) {
                    var btn = document.createElement('button');
                    btn.className = 'preset-btn';
                    btn.textContent = name;
                    btn.setAttribute('data-preset', name);
                    btn.onclick = function() { handlePresetClick(name); };
                    grid.appendChild(btn);
                });

                container.appendChild(grid);
            });

            // Render combo (stack) presets grouped by layer count
            var comboNames = Object.keys(STACK_PRESETS);
            if (comboNames.length > 0) {
                var tiers = [
                    { label: '2-Stack Combos', counts: [2] },
                    { label: '3-Stack Combos', counts: [3] },
                    { label: '5-Stack Combos', counts: [4, 5] },
                    { label: '10-Stack Combos', counts: [6, 7, 8, 9, 10] }
                ];

                tiers.forEach(function(tier) {
                    var names = comboNames.filter(function(n) {
                        return tier.counts.indexOf(STACK_PRESETS[n].layers.length) >= 0;
                    });
                    if (names.length === 0) return;

                    var label = document.createElement('div');
                    label.className = 'category-label combo-label';
                    label.textContent = tier.label;
                    container.appendChild(label);

                    var grid = document.createElement('div');
                    grid.className = 'preset-grid';

                    names.forEach(function(name) {
                        var btn = document.createElement('button');
                        btn.className = 'preset-btn combo';
                        btn.textContent = name;
                        btn.setAttribute('data-combo', name);
                        btn.onclick = function() { handleComboPresetClick(name); };
                        grid.appendChild(btn);
                    });

                    container.appendChild(grid);

        // --- Handle combo preset click ---
        function handleComboPresetClick(name) {
            var combo = STACK_PRESETS[name];
            if (!combo) return;

            // Force auto-stack on
            autoStackMode = true;
            document.getElementById('autoStackToggle').checked = true;
            updateStackUI();

            // Load all layers into stack (replacing whatever was there)
            stackLayers = [];
            combo.layers.forEach(function(layer) {
                stackLayers.push({
                    name: layer.name,
                    params: JSON.parse(JSON.stringify(layer.params)),
                    delay: layer.delay
                });
            });

            // Load first layer into controls
            editingLayerIdx = 0;
            loadParamsIntoControls(stackLayers[0].params, stackLayers[0].name);

            // Highlight combo button
            activeComboPreset = name;
            activePreset = stackLayers[0].name;
            highlightPreset(null);
            highlightComboPreset(name);

            renderStack();
            updateStackedHighlights();

            // Auto-play the whole stack
            if (userInteracted) playStack();
        }

        function highlightComboPreset(name) {
            var comboBtns = document.querySelectorAll('.preset-btn.combo');
            comboBtns.forEach(function(btn) {

                btn.classList.toggle('active', cName === name);
            });

        // --- Handle preset click (normal or auto-stack mode) ---
        function handlePresetClick(name) {
            activeComboPreset = null;
            highlightComboPreset(null);

            if (autoStackMode) {
                // Toggle: if already in stack, remove it; else add it
                var existingIdx = findStackLayerByPreset(name);
                if (existingIdx >= 0) {
                    stackLayers.splice(existingIdx, 1);
                    if (editingLayerIdx === existingIdx) editingLayerIdx = -1;
                    else if (editingLayerIdx > existingIdx) editingLayerIdx--;
                    renderStack();
                } else if (stackLayers.length < MAX_LAYERS) {
                    var p = PRESETS[name];
                    if (!p) return;
                    var params = {
                        osc1Type: p.osc1Type, osc1Freq: p.osc1Freq,
                        osc2Type: p.osc2Type, osc2Freq: p.osc2Freq,
                        volume: p.volume, duration: p.duration,
                        distortion: p.distortion, filterFreq: p.filterFreq,
                        filterQ: p.filterQ, detune: p.detune
                    };
                    stackLayers.push({ name: name, params: params, delay: stackLayers.length === 0 ? 0 : 100 });
                    editingLayerIdx = stackLayers.length - 1;
                    renderStack();
                }
                // Always load controls to last clicked
                loadPresetIntoControls(name);
                if (userInteracted) playCurrentSound();
            } else {
                // Single mode: replace the single layer and auto-play
                loadPresetIntoControls(name);
                var params = getCurrentParams();
                stackLayers = [{ name: name, params: params, delay: 0 }];
                editingLayerIdx = 0;
                renderStack();
                if (userInteracted) playCurrentSound();
            }
            updateStackedHighlights();
        }

        function findStackLayerByPreset(name) {
            for (var i = 0; i < stackLayers.length; i++) {
                if (stackLayers[i].name === name) return i;
            }
            return -1;
        }

        function updateAllDisplays() {
            ['ctrl-osc1Type', 'ctrl-osc1Freq', 'ctrl-osc2Type', 'ctrl-osc2Freq',

             'ctrl-filterFreq', 'ctrl-filterQ', 'ctrl-detune'].forEach(updateDisplay);
        }

        // --- Distortion curve ---
        function makeDistortionCurve(amount) {
            var samples = 44100;
            var curve = new Float32Array(samples);
            var deg = Math.PI / 180;
            for (var i = 0; i < samples; i++) {
                var x = (i * 2) / samples - 1;
                curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
            }
            return curve;
        }

        // --- Synth engine ---
        window.playSynthSound = function(params) {
            var ctx = getAudioContext();
            if (!ctx) return;

            var startTime = ctx.currentTime;
            var dur = params.duration;

            // Build chain endpoint
            var masterGain = ctx.createGain();
            masterGain.gain.setValueAtTime(0.001, startTime);
            masterGain.gain.exponentialRampToValueAtTime(params.volume, startTime + 0.005);
            masterGain.gain.setValueAtTime(params.volume, startTime + dur * 0.8);
            masterGain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
            masterGain.connect(ctx.destination);

            // Optional filter
            var outputNode = masterGain;
            if (params.filterQ > 0.5) {
                var filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = params.filterFreq;
                filter.Q.value = params.filterQ;
                filter.connect(masterGain);
                outputNode = filter;
            }

            // Optional distortion
            var distortionNode = outputNode;
            if (params.distortion > 0) {
                var waveshaper = ctx.createWaveShaper();
                waveshaper.curve = makeDistortionCurve(params.distortion);
                waveshaper.oversample = '4x';
                waveshaper.connect(outputNode);
                distortionNode = waveshaper;
            }

            // Oscillator 1
            var osc1 = ctx.createOscillator();
            osc1.type = params.osc1Type;
            osc1.frequency.value = params.osc1Freq;
            osc1.connect(distortionNode);
            osc1.start(startTime);
            osc1.stop(startTime + dur);

            // Oscillator 2
            if (params.osc2Type !== 'off') {
                var osc2 = ctx.createOscillator();
                osc2.type = params.osc2Type;
                osc2.frequency.value = params.osc2Freq + params.detune;
                osc2.connect(distortionNode);
                osc2.start(startTime);
                osc2.stop(startTime + dur);
            }
        };

        window.playCurrentSound = function() {
            playSynthSound(getCurrentParams());
        };

        // --- Debounced autoplay for slider changes ---
        var autoplayTimer = null;
        function scheduleAutoplay() {
            clearTimeout(autoplayTimer);
            autoplayTimer = setTimeout(function() {
                if (userInteracted) playCurrentSound();
            }, 80);
        }

        // --- Sound Stack ---
        var MAX_LAYERS = 10;
        var stackLayers = []; // [{name, params, delay}]

        window.removeLayer = function(idx) {
            stackLayers.splice(idx, 1);
            if (editingLayerIdx === idx) editingLayerIdx = -1;
            else if (editingLayerIdx > idx) editingLayerIdx--;
            // In single mode, if we removed the only layer, re-add from current controls
            if (!autoStackMode && stackLayers.length === 0) {
                var params = getCurrentParams();
                var name = activePreset || 'Custom';
                stackLayers = [{ name: name, params: params, delay: 0 }];
                editingLayerIdx = 0;
            }
            renderStack();
            updateStackedHighlights();
        };

        window.updateLayerDelay = function(idx, val) {
            stackLayers[idx].delay = parseInt(val);
            var label = document.getElementById('delay-val-' + idx);
            if (label) label.textContent = val + 'ms';
        };

        window.clearStack = function() {
            stackLayers = [];
            editingLayerIdx = -1;
            activeComboPreset = null;
            highlightComboPreset(null);
            renderStack();
            updateStackedHighlights();
        };

        window.playStack = function() {
            if (stackLayers.length === 0) return;
            if (!autoStackMode && stackLayers.length === 1) {
                // Single mode: just play the current sound
                playSynthSound(stackLayers[0].params);
                return;
            }
            stackLayers.forEach(function(layer) {
                setTimeout(function() {
                    playSynthSound(layer.params);
                }, layer.delay);
            });
        };

        // --- Export: single or stacked depending on mode ---
        window.exportStackOrSingle = function() {
            if (!autoStackMode || stackLayers.length <= 1) {
                exportCode();
            } else {
                exportStack();
            }
        };

        function renderStack() {
            var container = document.getElementById('stackLayers');
            var btnPlay = document.getElementById('btnPlayStack');
            var btnExport = document.getElementById('btnExportStack');

            btnPlay.disabled = stackLayers.length === 0;
            btnExport.disabled = stackLayers.length === 0;

            if (stackLayers.length === 0) {
                container.innerHTML = '<div class="stack-empty">Click a preset to load a sound.</div>';
                return;
            }

            container.innerHTML = '';
            stackLayers.forEach(function(layer, idx) {
                var div = document.createElement('div');
                div.className = 'stack-layer';
                if (idx === editingLayerIdx) div.classList.add('editing');

                var numSpan = document.createElement('span');
                numSpan.className = 'layer-num';
                numSpan.textContent = (idx + 1);
                if (idx === editingLayerIdx) numSpan.textContent += '*';

                var nameSpan = document.createElement('span');
                nameSpan.className = 'layer-name';
                nameSpan.style.cursor = 'pointer';
                var summary = layer.name + ' (' + layer.params.osc1Type + ' ' + layer.params.osc1Freq + 'Hz';
                if (layer.params.osc2Type !== 'off') summary += ' + ' + layer.params.osc2Type + ' ' + layer.params.osc2Freq + 'Hz';
                summary += ', ' + layer.params.duration + 's)';
                nameSpan.textContent = summary;
                nameSpan.title = 'Click to edit this layer';
                nameSpan.onclick = (function(i) {
                    return function() { selectLayerForEditing(i); };
                })(idx);

                var delayDiv = document.createElement('div');
                delayDiv.className = 'layer-delay';
                var delaySlider = document.createElement('input');
                delaySlider.type = 'range';
                delaySlider.min = '0';
                delaySlider.max = '1000';
                delaySlider.value = layer.delay;
                delaySlider.setAttribute('aria-label', 'Delay for layer ' + (idx + 1));
                delaySlider.oninput = (function(i) {
                    return function() { updateLayerDelay(i, this.value); };
                })(idx);
                var delayLabel = document.createElement('span');
                delayLabel.className = 'layer-delay-val';
                delayLabel.id = 'delay-val-' + idx;
                delayLabel.textContent = layer.delay + 'ms';
                delayDiv.appendChild(delaySlider);
                delayDiv.appendChild(delayLabel);

                var removeBtn = document.createElement('button');
                removeBtn.className = 'btn-remove-layer';
                removeBtn.textContent = 'X';
                removeBtn.onclick = (function(i) {
                    return function() { removeLayer(i); };
                })(idx);

                div.appendChild(numSpan);
                div.appendChild(nameSpan);
                div.appendChild(delayDiv);
                div.appendChild(removeBtn);
                container.appendChild(div);
            });
        }

        // --- Select layer for editing ---
        function selectLayerForEditing(idx) {
            editingLayerIdx = idx;
            var layer = stackLayers[idx];
            if (!layer) return;
            // Load this layer's params into controls
            loadParamsIntoControls(layer.params, layer.name);
            renderStack();
        }

        // --- Update editing layer when controls change ---
        function syncEditingLayer() {
            if (editingLayerIdx >= 0 && editingLayerIdx < stackLayers.length) {
                stackLayers[editingLayerIdx].params = getCurrentParams();
                stackLayers[editingLayerIdx].name = activePreset || 'Custom';
                renderStack();
                updateStackedHighlights();
            } else if (!autoStackMode && stackLayers.length === 1) {
                // Single mode: always sync the single layer
                stackLayers[0].params = getCurrentParams();
                stackLayers[0].name = activePreset || 'Custom';
                renderStack();
                updateStackedHighlights();
            }
        }

        // --- Export Stack ---
        window.exportStack = function() {
            if (stackLayers.length === 0) return;
            var needsDistortion = stackLayers.some(function(l) { return l.params.distortion > 0; });

            var lines = ['// Generated by Buzz Tester — Stacked Sound (' + stackLayers.length + ' layers)'];
            lines.push('function playBuzzStacked(ctx) {');
            lines.push('    var t = ctx.currentTime;');
            lines.push('');

            stackLayers.forEach(function(layer, idx) {
                var p = layer.params;
                var delayS = (layer.delay / 1000).toFixed(3);
                var prefix = '    // Layer ' + (idx + 1) + ': ' + layer.name;
                lines.push(prefix);
                lines.push('    (function() {');
                lines.push('        var startTime = t + ' + delayS + ';');
                lines.push('        var duration = ' + p.duration + ';');
                lines.push('        var gain = ctx.createGain();');
                lines.push('        gain.gain.setValueAtTime(0.001, startTime);');
                lines.push('        gain.gain.exponentialRampToValueAtTime(' + p.volume + ', startTime + 0.005);');
                lines.push('        gain.gain.setValueAtTime(' + p.volume + ', startTime + duration * 0.8);');
                lines.push('        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);');
                lines.push('        gain.connect(ctx.destination);');

                var connectTo = 'gain';
                if (p.filterQ > 0.5) {
                    lines.push('        var filter = ctx.createBiquadFilter();');
                    lines.push('        filter.type = \'bandpass\';');
                    lines.push('        filter.frequency.value = ' + p.filterFreq + ';');
                    lines.push('        filter.Q.value = ' + p.filterQ + ';');
                    lines.push('        filter.connect(gain);');
                    connectTo = 'filter';
                }
                if (p.distortion > 0) {
                    lines.push('        var ws = ctx.createWaveShaper();');
                    lines.push('        ws.curve = makeDistortionCurve(' + p.distortion + ');');
                    lines.push('        ws.oversample = \'4x\';');
                    lines.push('        ws.connect(' + connectTo + ');');
                    connectTo = 'ws';
                }

                lines.push('        var osc1 = ctx.createOscillator();');
                lines.push('        osc1.type = \'' + p.osc1Type + '\';');
                lines.push('        osc1.frequency.value = ' + p.osc1Freq + ';');
                lines.push('        osc1.connect(' + connectTo + ');');
                lines.push('        osc1.start(startTime);');
                lines.push('        osc1.stop(startTime + duration);');

                if (p.osc2Type !== 'off') {
                    lines.push('        var osc2 = ctx.createOscillator();');
                    lines.push('        osc2.type = \'' + p.osc2Type + '\';');
                    lines.push('        osc2.frequency.value = ' + (p.osc2Freq + p.detune) + ';');
                    lines.push('        osc2.connect(' + connectTo + ');');
                    lines.push('        osc2.start(startTime);');
                    lines.push('        osc2.stop(startTime + duration);');
                }

                lines.push('    })();');
                lines.push('');
            });

            lines.push('}');

            if (needsDistortion) {
                lines.push('');
                lines.push('function makeDistortionCurve(amount) {');
                lines.push('    var samples = 44100;');
                lines.push('    var curve = new Float32Array(samples);');
                lines.push('    var deg = Math.PI / 180;');
                lines.push('    for (var i = 0; i < samples; i++) {');
                lines.push('        var x = (i * 2) / samples - 1;');
                lines.push('        curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));');
                lines.push('    }');
                lines.push('    return curve;');
                lines.push('}');
            }

            var code = lines.join('\n');
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code).then(showToast).catch(function() {
                    fallbackCopy(code);
                });
            } else {
                fallbackCopy(code);
            }
        };

        // --- Export Single ---
        window.exportCode = function() {
            var p = getCurrentParams();
            var lines = [
                '// Generated by Buzz Tester',
                'function playBuzzCustom(ctx, startTime, duration) {',
                '    duration = duration || ' + p.duration + ';'
            ];

            // Gain
            lines.push('    var gain = ctx.createGain();');
            lines.push('    gain.gain.setValueAtTime(0.001, startTime);');
            lines.push('    gain.gain.exponentialRampToValueAtTime(' + p.volume + ', startTime + 0.005);');
            lines.push('    gain.gain.setValueAtTime(' + p.volume + ', startTime + duration * 0.8);');
            lines.push('    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);');

            var connectTo = 'gain';

            // Filter
            if (p.filterQ > 0.5) {
                lines.push('    var filter = ctx.createBiquadFilter();');
                lines.push('    filter.type = \'bandpass\';');
                lines.push('    filter.frequency.value = ' + p.filterFreq + ';');
                lines.push('    filter.Q.value = ' + p.filterQ + ';');
                lines.push('    filter.connect(gain);');
                connectTo = 'filter';
            } else {
                lines.push('    gain.connect(ctx.destination);');
            }

            // Distortion
            if (p.distortion > 0) {
                lines.push('    var waveshaper = ctx.createWaveShaper();');
                lines.push('    waveshaper.curve = makeDistortionCurve(' + p.distortion + ');');
                lines.push('    waveshaper.oversample = \'4x\';');
                lines.push('    waveshaper.connect(' + connectTo + ');');
                connectTo = 'waveshaper';
            }

            // Connect gain to destination (if filter present)
            if (p.filterQ > 0.5) {
                lines.push('    gain.connect(ctx.destination);');
            }

            // Osc1
            lines.push('    var osc1 = ctx.createOscillator();');
            lines.push('    osc1.type = \'' + p.osc1Type + '\';');
            lines.push('    osc1.frequency.value = ' + p.osc1Freq + ';');
            lines.push('    osc1.connect(' + connectTo + ');');
            lines.push('    osc1.start(startTime);');
            lines.push('    osc1.stop(startTime + duration);');

            // Osc2
            if (p.osc2Type !== 'off') {
                lines.push('    var osc2 = ctx.createOscillator();');
                lines.push('    osc2.type = \'' + p.osc2Type + '\';');
                lines.push('    osc2.frequency.value = ' + (p.osc2Freq + p.detune) + ';');
                lines.push('    osc2.connect(' + connectTo + ');');
                lines.push('    osc2.start(startTime);');
                lines.push('    osc2.stop(startTime + duration);');
            }

            lines.push('}');

            // Add distortion curve helper if needed
            if (p.distortion > 0) {
                lines.push('');
                lines.push('function makeDistortionCurve(amount) {');
                lines.push('    var samples = 44100;');
                lines.push('    var curve = new Float32Array(samples);');
                lines.push('    var deg = Math.PI / 180;');
                lines.push('    for (var i = 0; i < samples; i++) {');
                lines.push('        var x = (i * 2) / samples - 1;');
                lines.push('        curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));');
                lines.push('    }');
                lines.push('    return curve;');
                lines.push('}');
            }

            var code = lines.join('\n');

            // Copy to clipboard
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code).then(showToast).catch(function() {
                    fallbackCopy(code);
                });
            } else {
                fallbackCopy(code);
            }
        };

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (e) {
                alert('Copy failed. Code:\n\n' + text);
            }
            document.body.removeChild(ta);
        }

        function showToast() {
            var toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(function() { toast.classList.remove('show'); }, 1500);
        }

        // --- Event listeners ---
        function setupListeners() {
            var controls = document.querySelectorAll('.controls-grid select, .controls-grid input[type="range"]');
            controls.forEach(function(ctrl) {
                ctrl.addEventListener('input', function() {
                    updateDisplay(ctrl.id);
                    activePreset = null;
                    highlightPreset(null);
                    syncEditingLayer();
                    scheduleAutoplay();
                });
                // Also fire on select change (for waveform dropdowns)
                if (ctrl.tagName === 'SELECT') {
                    ctrl.addEventListener('change', function() {
                        updateDisplay(ctrl.id);
                        activePreset = null;
                        highlightPreset(null);
                        syncEditingLayer();
                        scheduleAutoplay();
                    });
                }
            });
        }

        // --- Init ---
        buildPresets();
        setupListeners();
        updateAllDisplays();
        updateStackUI();
        loadPresetIntoControls('Classic Buzzer');
        // Initialize single layer in single mode
        var initParams = getCurrentParams();
        stackLayers = [{ name: 'Classic Buzzer', params: initParams, delay: 0 }];
        editingLayerIdx = 0;
        renderStack();
    })();
    </script>
</body>
</html>
